<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400">
  <!-- Original decorative illustration for the Tech Abuse Checklists.
       It does not reproduce any content from the checklists themselves. -->
  <defs>
    <clipPath id="cl-blob">
      <path d="M246 34c86-8 168 44 182 128 13 78-40 108-70 160-34 58-112 82-186 58-70-23-124-64-128-148C40 128 138 44 246 34z"/>
    </clipPath>
    <pattern id="cl-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0v24" fill="none" stroke="#5C2B84" stroke-opacity=".22" stroke-width="1.4"/>
    </pattern>
    <filter id="cl-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2B1240" flood-opacity=".28"/>
    </filter>
  </defs>

  <!-- grid blob (handbook motif) -->
  <path d="M246 34c86-8 168 44 182 128 13 78-40 108-70 160-34 58-112 82-186 58-70-23-124-64-128-148C40 128 138 44 246 34z" fill="#C08BDD"/>
  <rect width="480" height="400" fill="url(#cl-grid)" clip-path="url(#cl-blob)"/>

  <!-- orbit line -->
  <path d="M38 300c60 92 300 104 410-36" fill="none" stroke="#E3957F" stroke-width="3" stroke-linecap="round"/>
  <circle cx="38" cy="300" r="6" fill="#E3957F"/>
  <circle cx="448" cy="264" r="6" fill="#E3957F"/>

  <!-- sparkle strokes -->
  <g stroke="#E3957F" stroke-width="5" stroke-linecap="round">
    <path d="M118 66l-12-18M146 54l-2-22M176 60l10-18"/>
  </g>

  <!-- back sheet -->
  <g transform="rotate(8 268 206)" filter="url(#cl-shadow)">
    <rect x="168" y="76" width="200" height="262" rx="20" fill="#EDE7D9"/>
    <rect x="196" y="250" width="120" height="10" rx="5" fill="#D9CDB8"/>
    <rect x="196" y="274" width="90" height="10" rx="5" fill="#D9CDB8"/>
  </g>

  <!-- front sheet -->
  <g transform="rotate(-5 232 204)" filter="url(#cl-shadow)">
    <rect x="128" y="62" width="214" height="282" rx="20" fill="#FBF6EE"/>
    <path d="M148 62h174a20 20 0 0 1 20 20v30H128V82a20 20 0 0 1 20-20z" fill="#5C2B84"/>
    <rect x="150" y="80" width="52" height="14" rx="7" fill="#FBF3EA" fill-opacity=".9"/>
    <rect x="212" y="83" width="82" height="8" rx="4" fill="#C08BDD"/>

    <g fill="none" stroke="#77499F" stroke-width="3">
      <rect x="150" y="134" width="22" height="22" rx="6"/>
      <rect x="150" y="182" width="22" height="22" rx="6"/>
      <rect x="150" y="230" width="22" height="22" rx="6"/>
      <rect x="150" y="278" width="22" height="22" rx="6"/>
    </g>
    <g fill="none" stroke="#2C7B7F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M154 145l5 5 10-11"/>
      <path d="M154 193l5 5 10-11"/>
      <path d="M154 241l5 5 10-11"/>
    </g>
    <g fill="#DCC4EC">
      <rect x="186" y="136" width="128" height="9" rx="4.5"/>
      <rect x="186" y="150" width="84" height="7" rx="3.5" fill="#EBDDF3"/>
      <rect x="186" y="184" width="110" height="9" rx="4.5"/>
      <rect x="186" y="198" width="96" height="7" rx="3.5" fill="#EBDDF3"/>
      <rect x="186" y="232" width="122" height="9" rx="4.5"/>
      <rect x="186" y="246" width="70" height="7" rx="3.5" fill="#EBDDF3"/>
      <rect x="186" y="280" width="100" height="9" rx="4.5"/>
      <rect x="186" y="294" width="80" height="7" rx="3.5" fill="#EBDDF3"/>
    </g>
  </g>

  <!-- lock badge -->
  <g filter="url(#cl-shadow)">
    <circle cx="352" cy="304" r="40" fill="#5C2B84"/>
    <circle cx="352" cy="304" r="40" fill="none" stroke="#FBF3EA" stroke-width="5"/>
  </g>
  <g fill="none" stroke="#FBF3EA" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M340 300v-8a12 12 0 0 1 24 0v8"/>
  </g>
  <rect x="332" y="298" width="40" height="28" rx="7" fill="#FBF3EA"/>
  <circle cx="352" cy="310" r="4" fill="#5C2B84"/>
  <path d="M352 312v6" stroke="#5C2B84" stroke-width="4" stroke-linecap="round"/>
</svg>
